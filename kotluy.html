<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Money Tracker</title>

  <!-- Google & Telegram SDKs -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script async src="https://telegram.org/js/telegram-widget.js?22"></script>

  <style>
    :root {
      --green: #208767;
      --green-dark: #176f54;
      --green-soft: #eaf5f0;
      --red: #b95d5d;
      --ink: #242a26;
      --muted: #818983;
      --line: #e8ece9;
      --surface: #fff;
      --background: #f4f7f4;
      --shadow: 0 8px 24px rgba(35, 65, 48, .045);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family: Arial, "Noto Sans Khmer", "Khmer OS System", sans-serif;
    }

    .app {
      width: min(100% - 48px, 1720px);
      margin: 0 auto;
      padding: 42px 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(25px, 3vw, 38px);
      font-weight: 800;
    }

    h2 { margin: 0 0 22px; font-size: 21px; font-weight: 750; }
    p { margin-top: 0; }
    .subtitle { margin: 0; color: var(--muted); font-size: 16px; }
    button, input, select { font: inherit; }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 12px;
      padding: 13px 19px;
      font-weight: 700;
      transition: transform .15s ease, background .15s ease;
    }

    button:hover, .page-link:hover { transform: translateY(-1px); }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .header-actions button, .header-actions a { min-height: 52px; }

    .page-link, .language-button, .export-button, .auth-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 21px;
      border: 1px solid #d8ebe1;
      border-radius: 12px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-weight: 700;
      text-decoration: none;
      gap: 8px;
    }

    .settings-button {
      min-height: 52px;
      padding: 13px 21px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
    }

    .create-list-icon {
      width: 52px;
      min-width: 52px;
      min-height: 52px;
      padding: 0;
      border: 1px solid #d8ebe1;
      border-radius: 12px;
      background: var(--green-soft);
      color: var(--green-dark);
      font-size: 30px;
      line-height: 1;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Auth Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal-overlay[hidden] { display: none !important; }

    .modal-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px;
      width: min(100% - 32px, 420px);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .auth-options {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 20px 0;
      align-items: center;
    }

    .close-modal-btn {
      width: 100%;
      background: var(--background);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .user-info-card {
      padding: 16px;
      border-radius: 14px;
      background: var(--background);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }

    .logout-btn {
      width: 100%;
      background: #fde8e8;
      color: var(--red);
    }

    .preferences {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: end;
      gap: 16px;
      margin-bottom: 28px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .preferences[hidden] { display: none !important; }
    .preferences .field { margin: 0; }

    .rate-hint {
      grid-column: 1 / -1;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .settings-export { display: flex; align-items: end; }
    .settings-export button { width: 100%; min-height: 54px; }

    .layout {
      display: grid;
      grid-template-columns: minmax(340px, .36fr) minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .card, .summary-card {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card { padding: 28px; }
    .entry-card { position: sticky; top: 20px; }
    .main-content { min-width: 0; }
    .field { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 15px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      min-height: 54px;
      padding: 13px 16px;
      border: 1px solid #dfe4e0;
      border-radius: 13px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
    }

    input::placeholder { color: #a0a6a1; }

    input:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 4px rgba(32, 135, 103, .10);
    }

    .amount-entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px;
      gap: 10px;
    }

    .suggestion-label { margin-top: 15px; }

    .submit-button {
      width: 100%;
      min-height: 58px;
      margin-top: 2px;
      border-radius: 13px;
      background: var(--green);
      color: #fff;
      font-size: 17px;
    }

    .submit-button:hover { background: var(--green-dark); }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    .summary-card { min-width: 0; padding: 24px; }

    .summary-label {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 15px;
    }

    .summary-value {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(22px, 2vw, 34px);
      font-weight: 800;
    }

    .income { color: var(--green); }
    .expense { color: var(--red); }
    .section-card { margin-bottom: 24px; }

    .category-row {
      display: grid;
      grid-template-columns: minmax(90px, .2fr) minmax(80px, 1fr) minmax(100px, auto);
      gap: 16px;
      align-items: center;
      margin: 18px 0;
      font-size: 15px;
    }

    .bar-track {
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #edf1ee;
    }

    .bar {
      height: 100%;
      border-radius: inherit;
      background: var(--green);
    }

    .category-amount {
      text-align: right;
      font-weight: 750;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 18px;
    }

    .toolbar input { flex: 1; }
    .toolbar select { width: 220px; }
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 15px;
    }

    th, td {
      padding: 18px 12px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    th { color: var(--muted); font-size: 13px; font-weight: 700; }
    td:first-child, th:first-child { padding-left: 0; }

    td:last-child, th:last-child {
      padding-right: 0;
      text-align: right;
    }

    .delete-button {
      padding: 7px 10px;
      background: transparent;
      color: var(--muted);
    }

    .delete-button:hover { color: var(--red); }

    .empty-state {
      padding: 28px 0;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 1050px) {
      .layout {
        grid-template-columns: minmax(280px, .4fr) minmax(0, 1fr);
        gap: 18px;
      }

      .card { padding: 22px; }
      .summary { gap: 12px; }
      .summary-card { padding: 18px; }
    }

    @media (max-width: 820px) {
      .app {
        width: min(100% - 32px, 720px);
        padding: 28px 0;
      }

      header { align-items: flex-start; flex-wrap: wrap; }
      .layout { grid-template-columns: 1fr; }
      .entry-card { position: static; }
    }

    @media (max-width: 600px) {
      .app {
        width: calc(100% - 20px);
        padding: 14px 0;
      }

      header {
        gap: 12px;
        margin-bottom: 14px;
      }

      h1 {
        margin-bottom: 4px;
        font-size: 22px;
        line-height: 1.2;
      }

      h2 { margin-bottom: 14px; font-size: 17px; }
      .subtitle { font-size: 13px; }

      .header-actions {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        width: 100%;
        gap: 6px;
      }

      .header-actions > * {
        min-width: 0;
        min-height: 42px;
        padding: 8px 4px;
        border-radius: 10px;
        font-size: 11px;
        line-height: 1.15;
        text-align: center;
        white-space: nowrap;
      }

      .header-actions .create-list-icon {
        width: 100%;
        min-width: 0;
        padding: 0;
        font-size: 25px;
      }

      .preferences {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 20px;
        padding: 16px;
      }

      .rate-hint { grid-column: auto; }
      .settings-export button { width: 100%; }

      .summary {
        grid-template-columns: 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .summary-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 13px;
        border-radius: 15px;
      }

      .summary-label { margin: 0; font-size: 12px; }
      .summary-value { font-size: 18px; }
      .card { padding: 16px; border-radius: 15px; }
      .field { margin-bottom: 14px; }
      label { font-size: 13px; }

      input, select {
        min-height: 46px;
        padding: 10px 12px;
        font-size: 14px;
      }

      .amount-entry {
        grid-template-columns: minmax(0, 1fr) 88px;
        gap: 7px;
      }

      .submit-button { min-height: 48px; font-size: 15px; }
      .toolbar { flex-direction: column; }
      .toolbar select { width: 100%; }

      .category-row {
        grid-template-columns: 70px minmax(20px, 1fr) 82px;
        gap: 7px;
        font-size: 12px;
      }

      .category-amount { font-size: 12px; }

      .table-wrap { overflow: visible; }
      table, tbody { display: block; }
      thead { display: none; }
      tbody { display: grid; gap: 10px; }

      tbody tr {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
      }

      tbody td {
        min-width: 0;
        padding: 0;
        border: 0;
        white-space: normal;
      }

      tbody td:nth-child(1) {
        grid-column: 1;
        grid-row: 1;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      tbody td:nth-child(2) {
        grid-column: 1;
        grid-row: 2;
        color: var(--muted);
        font-size: 13px;
      }

      tbody td:nth-child(2)::before,
      tbody td:nth-child(3)::before {
        content: attr(data-label);
        font-weight: 700;
      }

      tbody td:nth-child(3) {
        grid-column: 1;
        grid-row: 3;
        color: var(--muted);
        font-size: 12px;
      }

      tbody td:nth-child(4) {
        grid-column: 2;
        grid-row: 1;
        text-align: right;
        white-space: nowrap;
        font-weight: 700;
      }

      tbody td:nth-child(5) {
        grid-column: 2;
        grid-row: 2 / span 2;
        align-self: center;
        text-align: right;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div style="width: 500px;">
        <h1 data-i18n="title">My Money Tracker</h1> 
        <select id="listSelect" style="width: 100%;"></select>
      </div>

      <div class="header-actions">
        <button class="create-list-icon" id="createListButton" type="button"
                title="Create list" aria-label="Create list">+</button>
        <button class="auth-button" id="authButton" type="button">
          <span id="authBtnLabel">Connect Account</span>
        </button>
        <button class="language-button" id="languageButton" type="button">ខ្មែរ</button>
        <button id="settingsButton" class="settings-button" type="button"
                aria-expanded="false" aria-controls="settingsPanel"
                data-i18n="settings">Settings</button>
        <a class="page-link" href="index.html">ToDo</a>
      </div>
    </header>

    <section class="preferences" id="settingsPanel" hidden>
      <div class="field">
        <label for="exchangeRate" data-i18n="exchangeRate">
          Exchange rate (KHR per 1 USD)
        </label>
        <input id="exchangeRate" type="number" min="0.0001" step="0.01" value="4000" />
      </div>

      <div class="field" >
        <select id="currencySelect" aria-label="Display currency">
          <option value="USD">US dollar (USD)</option>
          <option value="KHR">Cambodian riel (KHR)</option>
        </select>
      </div>

      <div class="settings-export">
        <button class="export-button" id="exportButton" type="button"
                data-i18n="export">Export CSV</button>
      </div>

      <p class="rate-hint" id="rateHint"></p>
    </section>

    <div class="layout" >
      <aside class="card entry-card">
        <h2 data-i18n="addHeading">Add a transaction</h2>

        <form id="transactionForm">

            <div class="field">
            <label for="type" data-i18n="type">Type</label>
            <select id="type">
              <option value="expense" data-i18n="expense">Expense</option>
              <option value="income" data-i18n="income">Income</option>
            </select>
          </div>

          <div class="field">
            <label for="amount" data-i18n="amount">Amount</label>
            <div class="amount-entry">
              <input id="amount" type="text" inputmode="decimal"
                     autocomplete="off" placeholder="0" required />
              <select id="entryCurrency" aria-label="Currency for this amount">
                <option value="USD">USD</option>
                <option value="KHR">KHR</option>
              </select>
            </div>
          </div>

          <div class="field">
             <label for="descriptionSuggestion" class="suggestion-label"
                   data-i18n="descriptionSuggestion">
              Quick suggestions (optional)
            </label>
            <select id="descriptionSuggestion">
              <option value="" data-i18n="chooseSuggestion">Choose a suggestion…</option>
            </select>

            <br><br><label for="description" data-i18n="description">Description</label>
            <input id="description" type="text" maxlength="60"
                   list="descriptionSuggestions"
                   placeholder="e.g. Lunch or monthly salary"
                   data-i18n-placeholder="descriptionPlaceholder" required />
            <datalist id="descriptionSuggestions"></datalist>
          </div>

          <div class="field">
            <label for="category" data-i18n="category">Category</label>
            <select id="category"></select>
          </div>

          <div class="field">
            <label for="date" data-i18n="date">Date</label>
            <input id="date" type="date" required />
          </div>

          <button class="submit-button" type="submit" data-i18n="addButton">
            Add transaction
          </button>
        </form>
      </aside>

      <main class="main-content">
        <section class="summary" aria-label="Money summary">
          <div class="summary-card">
            <p class="summary-label" data-i18n="balance">Balance (all time)</p>
            <p class="summary-value" id="balance">$0.00</p>
          </div>

          <div class="summary-card">
            <p class="summary-label" data-i18n="monthlyIncome">Income this month</p>
            <p class="summary-value income" id="monthlyIncome">$0.00</p>
          </div>

          <div class="summary-card">
            <p class="summary-label" data-i18n="monthlyExpenses">Expenses this month</p>
            <p class="summary-value expense" id="monthlyExpenses">$0.00</p>
          </div>
        </section>

        <section class="card section-card">
          <h2 data-i18n="breakdownHeading">Spending by category this month</h2>
          <div id="categoryBreakdown"></div>
        </section>

        <section class="card">
          <h2 data-i18n="transactionsHeading">Transactions</h2>

          <div class="toolbar">
            <input id="search" type="search" placeholder="Search transactions"
                   data-i18n-placeholder="search" />
            <select id="typeFilter" aria-label="Filter by type">
              <option value="all" data-i18n="allTypes">All types</option>
              <option value="income" data-i18n="income">Income</option>
              <option value="expense" data-i18n="filterExpenses">Expenses</option>
            </select>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="description">Description</th>
                  <th data-i18n="category">Category</th>
                  <th data-i18n="date">Date</th>
                  <th data-i18n="amount">Amount</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="transactionRows"></tbody>
            </table>
          </div>

          <div class="empty-state" id="emptyState"></div>
        </section>
      </main>
    </div>
  </div>

  <!-- Account Modal -->
  <div class="modal-overlay" id="authModal" hidden>
    <div class="modal-card">
      <h2 id="modalTitle">Connect Account</h2>

      <div id="loggedOutView">
        <p class="subtitle" style="margin-bottom: 20px;">Connect your account to sync transactions.</p>
        
        <div class="auth-options">
          <!-- Google Sign-In Container -->
          <div id="g_id_onload"
               data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
               data-callback="handleGoogleLogin">
          </div>
          <div class="g_id_signin" data-type="standard" data-shape="rectangular"></div>

          <!-- Telegram Login Widget Container -->
          <div id="telegramAuthContainer"></div>
        </div>
      </div>

      <div id="loggedInView" hidden>
        <div class="user-info-card">
          <img id="modalUserAvatar" class="user-avatar" src="" alt="User Avatar" />
          <div>
            <strong id="modalUserName">User Name</strong><br>
            <span id="modalUserMeta" style="color: var(--muted); font-size: 13px;"></span>
          </div>
        </div>
        <button class="logout-btn" id="logoutButton" type="button">Disconnect Account</button>
      </div>

      <button class="close-modal-btn" id="closeAuthModal" type="button" style="margin-top: 12px;">Close</button>
    </div>
  </div>

  <script>
    const LEGACY_STORAGE_KEY = "my-money-tracker-transactions";
    const LISTS_KEY = "my-money-tracker-lists";
    const ACTIVE_LIST_KEY = "my-money-tracker-active-list";
    const PREFS_KEY = "my-money-tracker-preferences";
    const USER_KEY = "my-money-tracker-user";

    // REPLACE WITH YOUR TELEGRAM BOT USERNAME (e.g., 'KotluyTrackerBot')
    const TELEGRAM_BOT_NAME = "YOUR_TELEGRAM_BOT_USERNAME";

    const CATEGORIES = {
      expense: ["Food", "Transport", "Bills", "Shopping", "Health", "Entertainment", "Other"],
      income: ["Salary", "Freelance", "Gift", "Investment", "Other"]
    };

    const DESCRIPTION_SUGGESTIONS = {
      en: [
        "Breakfast", "Lunch", "Dinner", "Groceries",
        "Transport", "Rent", "Salary", "Utilities"
      ],
      km: [
        "អាហារពេលព្រឹក", "អាហារថ្ងៃត្រង់", "អាហារពេលល្ងាច", "គ្រឿងទេស",
        "ការដឹកជញ្ជូន", "ថ្លៃជួល", "ប្រាក់ខែ", "វិក្កយបត្រ"
      ]
    };

    const TEXT = {
      en: {
        title: "My Money Tracker",
        subtitle: "Track your income and spending.",
        settings: "Settings",
        export: "Export CSV",
        recordList: "Record list",
        createList: "Create list",
        newListPrompt: "Name this list (for example, Expenses for my sister):",
        duplicateList: "A list with this name already exists.",
        addHeading: "Add a transaction",
        description: "Description",
        descriptionPlaceholder: "e.g. Lunch or monthly salary",
        descriptionSuggestion: "Quick suggestions (optional)",
        chooseSuggestion: "Choose a suggestion…",
        amount: "Amount",
        type: "Type",
        expense: "Expense",
        income: "Income",
        category: "Category",
        date: "Date",
        addButton: "Add transaction",
        balance: "Balance (all time)",
        monthlyIncome: "Income this month",
        monthlyExpenses: "Expenses this month",
        breakdownHeading: "Spending by category this month",
        noExpenses: "No expenses recorded this month.",
        transactionsHeading: "Transactions",
        search: "Search transactions",
        allTypes: "All types",
        filterExpenses: "Expenses",
        empty: "No transactions yet. Add one to get started.",
        noMatch: "No matching transactions.",
        delete: "Delete",
        exchangeRate: "Exchange rate (KHR per 1 USD)",
        rateHint: "Example rate only — edit it to your preferred rate.",
        rateLine: "1 USD = {rate} KHR",
        catFood: "Food",
        catTransport: "Transport",
        catBills: "Bills",
        catShopping: "Shopping",
        catHealth: "Health",
        catEntertainment: "Entertainment",
        catOther: "Other",
        catSalary: "Salary",
        catFreelance: "Freelance",
        catGift: "Gift",
        catInvestment: "Investment"
      },

    function makeId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function readPreferences() {
      try {
        return JSON.parse(localStorage.getItem(PREFS_KEY) || "{}");
      } catch {
        return {};
      }
    }

    const savedPreferences = readPreferences();
    let language = savedPreferences.language === "km" ? "km" : "en";
    let displayCurrency = language === "km" ? "KHR" : "USD";
    let exchangeRate = Number(savedPreferences.exchangeRate) > 0
      ? Number(savedPreferences.exchangeRate)
      : 4000;

    function loadLists() {
      try {
        const saved = JSON.parse(localStorage.getItem(LISTS_KEY) || "null");

        if (Array.isArray(saved) && saved.length > 0) {
          const validLists = saved
            .filter((list) => list && list.id && typeof list.name === "string")
            .map((list) => ({
              ...list,
              transactions: Array.isArray(list.transactions)
                ? list.transactions.map((item) => ({
                    ...item,
                    currency: item.currency === "KHR" ? "KHR" : "USD"
                  }))
                : []
            }));

          if (validLists.length > 0) return validLists;
        }
      } catch {}

      let oldTransactions = [];

      try {
        const old = JSON.parse(
          localStorage.getItem(LEGACY_STORAGE_KEY) || "[]"
        );

        if (Array.isArray(old)) {
          oldTransactions = old.map((item) => ({
            ...item,
            currency: item.currency === "KHR" ? "KHR" : "USD"
          }));
        }
      } catch {
        oldTransactions = [];
      }

      return [{
        id: makeId(),
        name: language === "km" ? "ប្រាក់របស់ខ្ញុំ" : "My Money",
        transactions: oldTransactions
      }];
    }

    let lists = loadLists();
    let activeListId = localStorage.getItem(ACTIVE_LIST_KEY);

    if (!lists.some((list) => list.id === activeListId)) {
      activeListId = lists[0].id;
    }

    function getActiveList() {
      return lists.find((list) => list.id === activeListId) || lists[0];
    }

    let transactions = getActiveList().transactions;

    function saveTransactions() {
      getActiveList().transactions = transactions;
      localStorage.setItem(LISTS_KEY, JSON.stringify(lists));
      localStorage.setItem(ACTIVE_LIST_KEY, activeListId);
    }

    function savePreferences() {
      localStorage.setItem(PREFS_KEY, JSON.stringify({
        language,
        currency: displayCurrency,
        exchangeRate
      }));
    }

    function t(key) {
      return TEXT[language][key] || TEXT.en[key] || key;
    }

    function categoryName(name) {
      return t("cat" + name) || name;
    }

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function convertAmount(amount, fromCurrency) {
      if (fromCurrency === displayCurrency) return amount;
      return fromCurrency === "USD"
        ? amount * exchangeRate
        : amount / exchangeRate;
    }

    function formatMoney(value) {
      const amount = new Intl.NumberFormat("en-US", {
        minimumFractionDigits: displayCurrency === "KHR" ? 0 : 2,
        maximumFractionDigits: displayCurrency === "KHR" ? 0 : 2
      }).format(value);

      return displayCurrency === "KHR" ? `${amount} ៛` : `$${amount}`;
    }

    function formatDate(dateString) {
      const [year, month, day] = dateString.split("-").map(Number);
      const locale = language === "km" ? "km-KH" : "en-US";
      return new Date(year, month - 1, day).toLocaleDateString(locale);
    }

    function currentMonthKey() {
      return localDateString().slice(0, 7);
    }

        loggedOutView.hidden = true;

    window.handleGoogleLogin = function(response) {
      try {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        currentUser = {
          provider: "google",
          id: payload.sub,
          name: payload.name,
          email: payload.email,
          photo: payload.picture
        };
        localStorage.setItem(USER_KEY, JSON.stringify(currentUser));
        updateAuthUI();
        authModal.hidden = true;
      } catch (e) {
        console.error("Google Auth failed", e);
      }
    };

        username: user.username,

    function formatAmountValue(value) {
      let cleaned = value
        .replace(/,/g, "")
        .replace(/[^\d.]/g, "");

      const firstDot = cleaned.indexOf(".");
      if (firstDot !== -1) {
        cleaned = cleaned.slice(0, firstDot + 1) +
          cleaned.slice(firstDot + 1).replace(/\./g, "");
      }

      if (entryCurrencyInput.value === "KHR") {
        cleaned = cleaned.split(".")[0];
      } else if (cleaned.includes(".")) {
        const [whole, decimal] = cleaned.split(".");
        cleaned = whole + "." + decimal.slice(0, 2);
      }

      const [whole, decimal] = cleaned.split(".");
      const groupedWhole = (whole || "").replace(/\B(?=(\d{3})+(?!\d))/g, ",");

      return cleaned.includes(".")
        ? groupedWhole + "." + decimal
        : groupedWhole;
    }

    function formatAmountInput() {
      const oldValue = amountInput.value;
      const caret = amountInput.selectionStart ?? oldValue.length;
      const beforeCaret = oldValue.slice(0, caret);
      const digitsBeforeCaret = (beforeCaret.match(/\d/g) || []).length;
      const decimalBeforeCaret =
        beforeCaret.includes(".") && entryCurrencyInput.value === "USD";
      const decimalDigitsBeforeCaret = decimalBeforeCaret
        ? (beforeCaret.split(".")[1].match(/\d/g) || []).length
        : 0;

      const formatted = formatAmountValue(oldValue);
      amountInput.value = formatted;

      let newCaret = 0;
      let digitCount = 0;

      if (digitsBeforeCaret > 0) {
        for (let i = 0; i < formatted.length; i++) {
          if (/\d/.test(formatted[i])) digitCount++;
          newCaret = i + 1;
          if (digitCount >= digitsBeforeCaret) break;
        }
      }

      if (decimalBeforeCaret && formatted.includes(".")) {
        newCaret = formatted.indexOf(".") + 1;
        let decimalCount = 0;

        while (newCaret < formatted.length &&
               decimalCount < decimalDigitsBeforeCaret) {
          if (/\d/.test(formatted[newCaret])) decimalCount++;
          newCaret++;
        }
      }

      amountInput.setSelectionRange(newCaret, newCaret);
    }

    function applyLanguage() {
      document.documentElement.lang = language === "km" ? "km" : "en";

      document.querySelectorAll("[data-i18n]").forEach((element) => {

    function makeCell(text, label = "") {
      const cell = document.createElement("td");
      cell.textContent = text;
      if (label) cell.dataset.label = label;
      return cell;
    }

    function renderSummary() {
      const month = currentMonthKey();

      const income = transactions
        .filter((item) => item.type === "income" && item.date.startsWith(month))
        .reduce((sum, item) =>
          sum + convertAmount(item.amount, item.currency), 0);

      const expenses = transactions
        .filter((item) => item.type === "expense" && item.date.startsWith(month))
        .reduce((sum, item) =>
          sum + convertAmount(item.amount, item.currency), 0);

      const balance = transactions.reduce((sum, item) => {
        const amount = convertAmount(item.amount, item.currency);
        return sum + (item.type === "income" ? amount : -amount);
      }, 0);

      document.getElementById("balance").textContent = formatMoney(balance);
      document.getElementById("monthlyIncome").textContent = formatMoney(income);
      document.getElementById("monthlyExpenses").textContent = formatMoney(expenses);
    }

    function renderCategories() {
      const container = document.getElementById("categoryBreakdown");
      container.replaceChildren();

      const month = currentMonthKey();
      const totals = {};

      transactions
        .filter((item) => item.type === "expense" && item.date.startsWith(month))
        .forEach((item) => {
          totals[item.category] = (totals[item.category] || 0) +
            convertAmount(item.amount, item.currency);
        });

      const categories = Object.entries(totals).sort((a, b) => b[1] - a[1]);

      if (categories.length === 0) {
        const message = document.createElement("p");
        message.className = "muted";
        message.textContent = t("noExpenses");
        container.appendChild(message);
        return;
      }

      const largest = categories[0][1];

      categories.forEach(([name, amount]) => {
        const line = document.createElement("div");
        line.className = "category-row";

        const label = document.createElement("span");
        label.textContent = categoryName(name);

        const track = document.createElement("div");
        track.className = "bar-track";

        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.width = `${Math.max(4, (amount / largest) * 100)}%`;
        track.appendChild(bar);

        const value = document.createElement("span");
        value.className = "category-amount";
        value.textContent = formatMoney(amount);

        line.append(label, track, value);
        container.appendChild(line);
      });
    }

    function renderTransactions() {
      rows.replaceChildren();

      const query = searchInput.value.trim().toLowerCase();
      const filter = typeFilter.value;

      const visible = [...transactions]
        .filter((item) => filter === "all" || item.type === filter)
        .filter((item) =>
          `${item.description} ${categoryName(item.category)}`
            .toLowerCase()
            .includes(query)
        )
        .sort((a, b) => b.date.localeCompare(a.date));

      visible.forEach((item) => {
        const row = document.createElement("tr");

        row.appendChild(makeCell(item.description));
        row.appendChild(makeCell(categoryName(item.category), t("category") + ": "));
        row.appendChild(makeCell(formatDate(item.date), t("date") + ": "));

        const amountCell = document.createElement("td");
        amountCell.className = item.type;
        const converted = convertAmount(item.amount, item.currency);
        amountCell.textContent =
          `${item.type === "income" ? "+" : "−"}${formatMoney(converted)}`;
        row.appendChild(amountCell);

        const actionCell = document.createElement("td");
        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = t("delete");
        deleteButton.setAttribute(
          "aria-label",
          `${t("delete")} ${item.description}`
        );
        deleteButton.addEventListener("click", () => deleteTransaction(item.id));
        actionCell.appendChild(deleteButton);
        row.appendChild(actionCell);

        rows.appendChild(row);
      });

      emptyState.hidden = visible.length > 0;
      emptyState.textContent = transactions.length > 0 ? t("noMatch") : t("empty");
    }

    function render() {
      renderSummary();
      renderCategories();
      renderTransactions();
    }

    function deleteTransaction(id) {
      transactions = transactions.filter((item) => item.id !== id);
      saveTransactions();
      render();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const amount = Number(amountInput.value.replace(/,/g, ""));
      if (!Number.isFinite(amount) || amount <= 0) return;

      transactions.push({
        id: makeId(),
        description: descriptionInput.value.trim(),
        amount,
        currency: entryCurrencyInput.value,
        type: typeInput.value,
        category: categoryInput.value,
        date: dateInput.value
      });

      saveTransactions();
      form.reset();

      typeInput.value = "expense";
      entryCurrencyInput.value = displayCurrency;
      dateInput.value = localDateString();

      updateCategories();
      render();
      descriptionInput.focus();
    });

      settingsButton.setAttribute("aria-expanded", String(!settingsPanel.hidden));

      const answer = prompt(t("newListPrompt"));
      if (!answer || !answer.trim()) return;

      const name = answer.trim();

      if (lists.some((list) => list.name.toLowerCase() === name.toLowerCase())) {
        alert(t("duplicateList"));
        return;
      }

      saveTransactions();

      const newList = {
        id: makeId(),
        name,
        transactions: []
      };

      lists.push(newList);
      activeListId = newList.id;
      transactions = newList.transactions;

      updateListSelect();
      saveTransactions();
      render();
    });

        descriptionSuggestionInput.value = "";

    amountInput.addEventListener("input", formatAmountInput);

    document.getElementById("languageButton").addEventListener("click", () => {

      applyLanguage();
    });

    exchangeRateInput.addEventListener("input", () => {
      const value = Number(exchangeRateInput.value);

      if (Number.isFinite(value) && value > 0) {
        exchangeRate = value;
        savePreferences();
        applyLanguage();
      }
    });

    typeInput.addEventListener("change", updateCategories);
    searchInput.addEventListener("input", renderTransactions);
    typeFilter.addEventListener("change", renderTransactions);

    document.getElementById("exportButton").addEventListener("click", () => {
      const activeList = getActiveList();
      const header = [
        "List",
        "Description",
        "Type",
        "Category",
        "Date",
        "Original Amount",
        "Original Currency",
        "Converted Amount",
        "Display Currency"
      ];

      const csvRows = transactions.map((item) => {
        const convertedAmount = convertAmount(item.amount, item.currency);
        const convertedText = convertedAmount.toFixed(
          displayCurrency === "KHR" ? 0 : 2
        );

        return [
          activeList.name,
          item.description,
          item.type,
          item.category,
          item.date,
          item.amount,
          item.currency,
          convertedText,
          displayCurrency
        ]
          .map((value) => `"${String(value).replaceAll('"', '""')}"`)
          .join(",");
      });

      const csv = "\uFEFF" + [header.join(","), ...csvRows].join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const safeName = activeList.name.replace(/[^\w-]+/g, "-") || "list";

      link.href = url;
      link.download = `money-tracker-${safeName}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    });

    currencySelect.value = displayCurrency;
    entryCurrencyInput.value = displayCurrency;
    exchangeRateInput.value = exchangeRate;
    dateInput.value = localDateString();

    applyLanguage();
    saveTransactions();
  </script>
</body>
</html>
